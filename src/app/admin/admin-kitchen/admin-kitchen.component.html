<div class="container mt-4">
  <h3 class="fw-bold mb-4 text-primary"><i class="bi bi-fire me-2"></i>รายการอาหารที่ต้องทำ</h3>
  <div class="row g-3">
    <div class="col-md-4" *ngFor="let order of activeOrders">
      <div class="card shadow-sm border-0" [style.border-left]="'5px solid ' + (order.status === 'pending' ? '#ffc107' : '#198754')">
        <div class="card-body">
          <div class="d-flex justify-content-between mb-3">
            <h5 class="fw-bold text-danger mb-0">โต๊ะที่ {{ order.tableId }}</h5>
            <span class="badge" [class]="order.status === 'pending' ? 'bg-warning text-dark' : 'bg-success'">
              {{ order.status === 'pending' ? 'รอปรุง' : 'เสิร์ฟแล้ว' }}
            </span>
          </div>
          <ul class="list-unstyled mb-3">
            <li *ngFor="let item of order.items" class="border-bottom py-2 d-flex justify-content-between">
              <span>{{ item.name }}</span>
              <span class="fw-bold text-primary">x {{ item.quantity }}</span>
            </li>
          </ul>
          <div class="d-flex gap-2">
            <button *ngIf="order.status === 'pending'" (click)="onUpdateStatus.emit(order.key)" class="btn btn-success btn-sm w-100">เสิร์ฟแล้ว</button>
            <button (click)="onDelete.emit(order.key)" class="btn btn-outline-secondary btn-sm"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
