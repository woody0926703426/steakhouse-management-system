<div class="container mt-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-receipt me-2"></i>รายการใบเสร็จทั้งหมด</h3>
  
  <div class="mb-4">
    <input type="text" [(ngModel)]="searchTable" class="form-control w-25" placeholder="ค้นหาด้วยเลขโต๊ะ...">
  </div>

  <div *ngFor="let order of filteredOrders" class="card mb-3 border-0 shadow-sm">
    <div class="card-body d-flex justify-content-between align-items-center">
      <div>
        <h5 class="fw-bold">โต๊ะที่ {{ order.tableId }}</h5>
        <p class="text-muted mb-0 small">เวลาสั่ง: {{ order.timestamp }}</p>
      </div>
      <div class="text-end">
        <h5 class="text-danger fw-bold">{{ (order.totalPrice * 1.07) | number:'1.2-2' }} ฿</h5>
        <button (click)="onPrint.emit(order)" class="btn btn-dark btn-sm">
          <i class="bi bi-printer me-1"></i> พิมพ์ใบเสร็จ
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="filteredOrders.length === 0" class="text-center py-5 text-muted">
    <i class="bi bi-inbox display-1"></i>
    <p class="mt-3">ไม่พบรายการสั่งอาหาร</p>
  </div>
</div>
